modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"
issueTrackerURL="https://www.curseforge.com/minecraft/mc-mods/automagia/comments"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
logoFile="automagia_logo.png"
logoBlur=false
displayName="${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/automagia"
authors="Oculifelis (reimplementation); Tuhljin (original Automagy design)"
credits="Automagy was designed by Tuhljin for Thaumcraft 4. This is a clean reimplementation from the mod's public descriptions; no original code or textures. Thaumaturge by Leclowndu93150 and contributors."
description='''
A reimplementation of Automagy (Thaumcraft 4 addon) for Thaumaturge on NeoForge 26.1.2.
'''

[[mixins]]
config="automagia.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[26.1.2.71,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="thaumaturge"
    type="required"
    versionRange="${thaumaturge_version_range}"
    ordering="AFTER"
    side="BOTH"
